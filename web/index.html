    <meta name="theme-color" content="#07080f" media="(prefers-color-scheme: dark)" />
    <!-- apply the saved theme before the first paint (no light flash in dark mode) -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('pe:theme') || '"system"')
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
        if (JSON.parse(localStorage.getItem('pe:ar-help') || 'true') === false) document.documentElement.classList.add('ar-help-off')
      } catch (e) {}
    </script>
    <title>CE — Learn Claude, speak better English</title>
